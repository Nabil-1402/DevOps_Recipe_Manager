[project]
name = "devops-recipe-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "“Nabil", email = "nabil.ahmed@kcl.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=4.1.0,<5.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
